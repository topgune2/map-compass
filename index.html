<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="目的地コンパス">
  <title>目的地コンパス - Googleマップ直線距離＆方角ナビ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css?v=4.0">
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand-group">
        <div class="brand-icon" aria-hidden="true">
          <!-- Lucide Compass Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">目的地コンパス</h1>
          <p class="brand-sub" id="sensorStatusBadge">ワンタップ開始待機中</p>
        </div>
      </div>

      <div class="top-actions">
        <span class="wakelock-pill" id="wakeLockBadge" hidden title="Screen Wake Lock 有効（画面スリープ防止中）">
          <!-- Lucide Sun Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <span>スリープ防止ON</span>
        </span>
      </div>
    </header>

    <!-- Destination Info Card -->
    <section class="dest-card" id="destinationCard" aria-live="polite">
      <div class="dest-header">
        <span class="dest-pin-icon" aria-hidden="true">
          <!-- Lucide MapPin Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </span>
        <div class="dest-text-wrap">
          <div class="dest-label-row">
            <span class="dest-tag">DESTINATION</span>
            <span class="dest-coords" id="destCoordsText">未設定</span>
          </div>
          <h2 class="dest-name" id="destNameText">Googleマップで「共有」→「コピー」して下のボタンをタップ</h2>
        </div>
        <a href="#" target="_blank" rel="noopener noreferrer" class="open-map-btn" id="btnOpenInGoogleMaps" hidden title="Googleマップで開く">
          <!-- Lucide ExternalLink Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          </svg>
        </a>
      </div>
    </section>

    <!-- Primary One-Tap Action Section (iOS / Android Main Flow) -->
    <section class="cta-section" id="primaryCtaSection">
      <!-- 1. メイン導線: 「コピーしたリンクから開始」（クリップボード読取 + コンパス有効化を1タップで同時実行） -->
      <button type="button" class="one-tap-main-btn" id="btnStartFromClipboard">
        <span class="pulse-dot" aria-hidden="true"></span>
        <!-- Lucide ClipboardPaste Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1Z"/>
          <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2M16 4h2a2 2 0 0 1 2 2v2M11 14h10"/>
          <path d="m17 10 4 4-4 4"/>
        </svg>
        <span id="btnStartFromClipboardLabel">コピーしたリンクから開始</span>
      </button>

      <!-- 2. Android共有(Web Share Target)やURLクエリで既に目的地がセットされている場合のワンタップ開始ボタン -->
      <button type="button" class="one-tap-shared-btn" id="btnStartPreloadedTarget" hidden>
        <span class="pulse-dot" aria-hidden="true"></span>
        <!-- Lucide Navigation Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 11 22 2 13 21 11 13 3 11"/>
        </svg>
        <span id="btnStartPreloadedLabel">コンパスを有効にして開始</span>
      </button>

      <!-- 3. 前回の目的地が localStorage に保存されている場合のワンタップ再開ボタン -->
      <button type="button" class="resume-prev-btn" id="btnResumeSavedTarget" hidden>
        <!-- Lucide History Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>
        </svg>
        <span id="btnResumeSavedLabel">前回の目的地で再開</span>
      </button>

      <p class="cta-hint" id="ctaHintText">
        Googleマップの「共有」→「コピー」のあと、上のボタンを1回タップするだけで計測が始まります
      </p>
    </section>

    <!-- Main Compass & Distance Area -->
    <main class="compass-stage">
      <div class="compass-bezel" id="compassBezel">
        <!-- Rotating Compass Rose (North / East / South / West) -->
        <div class="compass-rose" id="compassRose">
          <span class="cardinal cardinal-n">N</span>
          <span class="cardinal cardinal-e">E</span>
          <span class="cardinal cardinal-s">S</span>
          <span class="cardinal cardinal-w">W</span>
        </div>

        <!-- Rotating Target Direction Arrow (Bearing - Heading) -->
        <div class="arrow-rotator" id="arrowRotator">
          <div class="target-arrow" id="targetArrow">
            <svg viewBox="0 0 120 120" width="144" height="144" aria-hidden="true">
              <defs>
                <linearGradient id="navArrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#38bdf8" />
                  <stop offset="55%" stop-color="#0ea5e9" />
                  <stop offset="100%" stop-color="#10b981" />
                </linearGradient>
              </defs>
              <polygon points="60,8 100,104 60,82 20,104" fill="url(#navArrowGrad)" stroke="#e0f2fe" stroke-width="2.5" stroke-linejoin="round" />
            </svg>
          </div>
        </div>

        <div class="compass-center-dot"></div>
      </div>

      <!-- Large Distance Readout -->
      <div class="distance-panel">
        <div class="distance-label">目的地までの直線距離</div>
        <div class="distance-value-row">
          <span class="distance-number" id="distanceNumber">---</span>
          <span class="distance-unit" id="distanceUnit">m</span>
        </div>
        <div class="arrival-badge" id="arrivalBadge" hidden>目的地周辺に到着しました！</div>
      </div>

      <!-- Telemetry Grid -->
      <div class="telemetry-grid">
        <div class="telemetry-item">
          <span class="telemetry-label">目的地の方角 (Bearing)</span>
          <span class="telemetry-val" id="bearingText">--° (--)</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">スマホの向き (Heading)</span>
          <span class="telemetry-val" id="headingText">--° (--)</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">GPS精度 / 状態</span>
          <span class="telemetry-val" id="gpsAccuracyText">未取得</span>
        </div>
      </div>
    </main>

    <!-- Status / Error Toast -->
    <div class="toast-banner" id="statusToast" role="status" aria-live="polite" hidden></div>

    <!-- Bottom Controls: 「新しいコピーリンクを読み込む」 & 手動入力用の折りたたみフォーム -->
    <footer class="bottom-panel">
      <div class="bottom-actions-row">
        <button type="button" class="reload-clipboard-btn" id="btnReloadClipboard">
          <!-- Lucide RefreshCw Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          <span>新しいコピーリンクを読み込む</span>
        </button>

        <button type="button" class="toggle-manual-btn" id="btnToggleManual" aria-expanded="false">
          <span>手動入力</span>
          <svg class="chevron-icon" id="manualChevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>
      </div>

      <!-- Collapsible Manual Input Area -->
      <div class="manual-collapse-area" id="manualCollapseArea" hidden>
        <form id="manualUrlForm" class="url-form">
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              </svg>
            </span>
            <input
              type="text"
              id="manualUrlInput"
              class="url-input"
              placeholder="Googleマップのリンクや座標をペースト..."
              autocomplete="off"
            >
            <button type="submit" class="resolve-btn" id="btnResolveUrl">
              開始
            </button>
          </div>
        </form>

        <div class="quick-bar">
          <span class="quick-label">サンプル:</span>
          <div class="quick-chips">
            <button type="button" class="preset-chip" data-sample="東京タワー https://www.google.com/maps/place/Tokyo+Tower/@35.6585805,139.7454329,17z">東京タワー</button>
            <button type="button" class="preset-chip" data-sample="東京駅 !3d35.6812362!4d139.7671248">東京駅</button>
            <button type="button" class="preset-chip" data-sample="https://maps.app.goo.gl/7g8F5">短縮URL例</button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script src="./app.js?v=4.0"></script>
</body>
</html>
